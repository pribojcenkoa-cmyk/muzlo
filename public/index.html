<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muzlo - Музыкальный стриминг</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Боковая панель -->
  <aside class="sidebar">
    <!-- Логотип и иконка Discord -->
    <div class="logo-wrapper">
      <div class="logo">Muzlo.</div>
      <a href="https://discord.gg/XyemcssNu" target="_blank" class="discord-icon" title="Наш Discord">
        <svg viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
      </a>
    </div>
    
    <!-- Навигация -->
    <nav>
      <ul>
        <li id="nav-home" class="active">Главная</li>
        <li id="nav-search">Поиск</li>
        <li id="nav-library">Моя медиатека</li>
      </ul>
    </nav>
  </aside>

  <!-- Основной контент -->
  <main class="content">
    <header class="content-header">
      <h1 id="page-title">Все треки</h1>
      
      <!-- Строка поиска (скрыта по умолчанию) -->
      <div class="search-box" id="search-container" style="display: none;">
        <input type="text" id="search-input" placeholder="Что послушаем?">
      </div>
      
      <!-- Блок профиля / Кнопка Войти -->
      <div id="auth-container" class="auth-container">
        <button class="btn-auth" id="btn-open-auth">Войти</button>
      </div>
    </header>
    
    <!-- Контейнер для списка треков -->
    <div class="track-list" id="track-list"></div>
  </main>

  <!-- Нижний плеер -->
  <div class="player hidden">
    <div class="player-track-info">
      <img id="player-cover" src="" alt="Cover" class="player-cover hidden">
      <div class="player-text">
        <div id="player-title" class="player-title">Выберите трек</div>
        <div id="player-artist" class="player-artist">-</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="player-buttons">
        <button id="btn-prev" class="control-btn">⏮</button>
        <button id="btn-play" class="control-btn play-btn">▶</button>
        <button id="btn-next" class="control-btn">⏭</button>
      </div>
      <div class="player-progress">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-slider" value="0" min="0" max="100" step="1">
        <span id="total-time">0:00</span>
      </div>
    </div>

    <div class="player-volume">
      <span>🔊</span>
      <input type="range" id="volume-slider" value="1" min="0" max="1" step="0.01">
    </div>
  </div>

  <!-- Скрытый аудио-тег -->
  <audio id="audio-player"></audio>

  <!-- Модальное окно авторизации -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <span class="close-btn" id="btn-close-auth">&times;</span>
      <h2 id="modal-title">Вход</h2>
      
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email" required>
        <input type="password" id="auth-password" placeholder="Пароль (мин. 6 символов)" required>
        
        <button type="submit" class="btn-submit" id="btn-submit-auth">Войти</button>
      </form>
      
      <p class="toggle-auth">
        <span id="auth-toggle-text">Нет аккаунта?</span> 
        <a href="#" id="btn-toggle-auth">Зарегистрироваться</a>
      </p>
    </div>
  </div>

  <!-- Подключение скриптов -->
  <script src="/js/app.js"></script>
</body>
</html>
